- data_adr_id: DATA-ADR-015
  title: Emissão de acesso externo é serializada no banco
  decision_summary: 'A emissão não usa replay de resposta nem `Idempotency-Key`. A transação: 1. bloqueia a linha de `vehicle_stop` com `FOR UPDATE`; 2.
    revoga o token ativo da audiência; 3. cria o novo token; 4. confirma uma constraint partial unique; 5. grava evento, Outbox e auditoria. A versão concorrente
    é controlada pelo lock e pela constraint, não por ETag da parada. O OpenAPI deverá remover `If-Match` e `ETag` dessas duas operações. Se a resposta
    one-time for perdida, uma nova emissão revoga o token anterior desconhecido e devolve um novo segredo. ---'
  source_ref: 19 DATA-ADR-015 v2.1.3
  requirement_ids:
  - DEMO-EXT-001
  - DEMO-EXT-004
  work_package_ids:
