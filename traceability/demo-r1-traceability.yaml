- data_adr_id: DATA-ADR-014
  title: Evento de ocorrência incrementa a versão do aggregate proprietário
  decision_summary: 'Uma mutação aceita incrementa a versão do aggregate mesmo quando não muda seu estado principal. Exemplos: ```text ArrivalReported →
    VEHICLE_STOP CompletionForecastUpdated → VEHICLE_STOP ArrivalCorrected → VEHICLE_STOP PhoneCallRecorded → CASE AlertOccurrenceAdded → ALERT ``` Para
    eventos canônicos da DEMO-R1: ```text aggregate_sequence = aggregate_version resultante ```'
