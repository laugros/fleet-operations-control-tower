catalog_version: 2.1.4
release: DEMO-R1
status: NORMATIVE_AUTHORIZED_FOR_SCAFFOLD
fixtures_file: tests/spec/demo-r1-test-fixtures.yaml
source_documents:
- docs/16-demo-r1-executable-spec.md
- docs/17-domain-state-machines.md
- docs/18-authorization-and-external-access.md
- docs/19-logical-data-model.md
- docs/20-demo-r1-api-contracts.md
- docs/21-demo-r1-event-catalog.md
- docs/22-demo-r1-traceability-and-test-matrix.md
- docs/23-demo-r1-implementation-backlog.md
- docs/25-demo-r1-executable-test-catalog.md
- docs/28-demo-r1-seed-manifest.md
- docs/29-demo-r1-test-runner-contract.md
- policies/demo-r1-reset-recovery-policy.yaml
- policies/demo-r1-implementation-authorization-policy.yaml
- tests/spec/demo-r1-gate-test-plan.yaml
execution_rules:
  fixture_resolution: resolve fixture:// from fixtures file and fail on unresolved
  isolation: each test starts from named deterministic snapshot or seed alias
  clock: DemoClock seeded at 2026-08-01T15:00:00Z
  generation: runtime tests assert active demo_generation_id
  sensitive_values: environment-backed and redacted
  retries: assertion retry forbidden
  failure_evidence:
  - test_id
  - fixture
  - correlation_id
  - operation_id or command
  - resolved non-sensitive request
  - expected versus actual
  - event ids and generation
  - database diff
  runner_contract: demo-r1-test-runner-contract.yaml v2.1.3
  action_discriminator: action.type
  wildcard_test_selection: FORBIDDEN
  raw_database_statement: FORBIDDEN
  symbolic_ids: FORBIDDEN
  time_placeholders: FORBIDDEN
  scenario_programs: MUST resolve through runner_programs_file
  baseline_status: NORMATIVE_AUTHORIZED_FOR_SCAFFOLD
  final_review_required: true
  schema_revision: DEMO_R1_V213
  runner_registries_required: true
  gate_activation_policy: A test is mandatory only at its activation_gate. Before that gate it has state DEFERRED_BY_GATE and cannot block a work package
    or gate. At later gates it is part of cumulative regression.
  final_regression_gate: G6_EXECUTIVE
gates:
  G0_DOCUMENT_CONTRACT:
    required_suites:
    - STATIC
    - API_CONTRACT
    - EVENT_CONTRACT
    condition: OpenAPI, event registry, schemas, fixtures and test catalog validate.
  G1_FOUNDATION:
    required_prefixes:
    - TST-DEMO-ENV-
    - TST-DEMO-BANNER-
    - TST-DEMO-MODE-
    - TST-DEMO-SEED-
    - TST-AUTH-SESSION-
    - TST-DATA-IAM-
    required_ids:
    - TST-AUDIT-001
    - TST-AUDIT-002
    - TST-AUDIT-003
    - TST-DATA-RESET-004
    - TST-DATA-RESET-005
  G2_DOMAIN:
    required_prefixes:
    - TST-SM-CASE-
    - TST-SM-TASK-
    - TST-SM-STOP-
    - TST-SM-ARRIVAL-
    - TST-SM-ALERT-
    - TST-SM-CROSS-
    - TST-DATA-CASE-
    - TST-DATA-TASK-
    - TST-DATA-STOP-
    - TST-DATA-EVT-
    - TST-EVT-CONTRACT-
    required_ids:
    - TST-DATA-EVT-005
    - TST-DATA-EVT-006
    - TST-DATA-TASK-005
    - TST-EVT-CONTRACT-011
    - TST-EVT-CONTRACT-012
  G3_PROJECTIONS:
    required_ids:
    - TST-DATA-METRIC-001
    - TST-EVT-CONTRACT-008
    - TST-EVT-CONTRACT-009
    required_operation_tests:
    - getCaseOperationalView
    - getStopOperationalView
    - searchOperationalResources
    - listStopDashboard
    - getDemoMetrics
    - getCaseTimeline
    - getStopTimeline
  G4_TIME_COMMUNICATION:
    required_prefixes:
    - TST-SM-ALERT-
    - TST-AUTH-ADAPTER-
    required_ids:
    - E2E-DEMO-001
    - E2E-DEMO-003
  G5_EXTERNAL:
    required_prefixes:
    - TST-AUTH-EXT-
    - TST-DATA-EXT-
    required_ids:
    - TST-API-UPDATE-FORECAST-EXTERNAL-001
    - TST-DATA-EXT-006
    - TST-EVT-CONTRACT-010
  G6_EXECUTIVE:
    required_ids:
    - E2E-DEMO-000
    - E2E-DEMO-001
    - E2E-DEMO-002
    - E2E-DEMO-003
    - E2E-DEMO-004
    - E2E-DEMO-005
    condition: All six E2E pass after three consecutive resets.
