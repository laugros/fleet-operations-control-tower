registry_version: 2.1.4
release: DEMO-R1
status: NORMATIVE_AUTHORIZED_FOR_SCAFFOLD
operations:
- operation_code: DELETE_AND_RESEED_APP_USER
  handler_id: delete_and_reseed_app_user_snapshot
  transaction_isolation: SERIALIZABLE
  rollback_policy: ON_ASSERTION_FAILURE
  args_schema:
    type: object
    additionalProperties: false
    required:
    - seed_version
    properties:
      seed_version:
        const: 2.1.3
  effects:
  - delete app_user and dependent resettable IAM rows
  - reseed IAM rows from the selected resolved seed
  - preserve demo_reset_execution actor identity snapshot
  required_assertions:
  - requested_by_user_id_snapshot remains non-null
  - requested_by_identity_code remains stable
