              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: CSRF_VALIDATION_FAILED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: EXTERNAL_ACCESS_INVALID_OR_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Erro: EXTERNAL_ACTION_ALREADY_COMPLETED, IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Erro: INVALID_DEPARTURE_TIME.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Erro: RATE_LIMIT_EXCEEDED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Erro: DEMO_RESET_IN_PROGRESS.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptionsNoSniff'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyExternal'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        400:
        - INVALID_REQUEST
        403:
        - CSRF_VALIDATION_FAILED
        404:
        - EXTERNAL_ACCESS_INVALID_OR_EXPIRED
        409:
        - EXTERNAL_ACTION_ALREADY_COMPLETED
        - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD
        422:
        - INVALID_DEPARTURE_TIME
        429:
        - RATE_LIMIT_EXCEEDED
      x-primary-event-schema-version: 2
      x-demo-generation-guard: ACTIVE_REQUIRED
      x-external-response-security-profile: EXTERNAL_NO_STORE_V1
components:
  securitySchemes:
    internalSession:
      type: apiKey
      in: cookie
      name: fotc_demo_session
      description: Sessão interna server-side.
    internalCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Obrigatório em mutações autenticadas por cookie interno.
    externalSession:
      type: apiKey
      in: cookie
      name: fotc_external_session
      description: Sessão externa vinculada a um capability token.
    externalCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Obrigatório em mutações autenticadas por cookie externo.
    adapterId:
      type: apiKey
      in: header
      name: X-Demo-Adapter-Id
    adapterTimestamp:
      type: apiKey
      in: header
      name: X-Demo-Timestamp
    adapterSignature:
      type: apiKey
      in: header
      name: X-Demo-Signature
  parameters:
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Gerado pelo servidor quando ausente.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Versão no formato `"7"`.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  headers:
    XCorrelationId:
      description: Correlation ID efetivo.
      schema:
        type: string
        format: uuid
    ETag:
      description: Versão do aggregate no formato `"7"`.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    XCsrfToken:
      description: Token CSRF; manter somente em memória.
      schema:
        type: string
        minLength: 32
    SetCookie:
      description: Cookie de sessão HttpOnly.
      schema:
        type: string
    Location:
      description: URI do recurso criado.
      schema:
        type: string
    RetryAfter:
      description: Segundos até nova tentativa.
      schema:
        type: integer
        minimum: 1
    XDemoGenerationId:
      description: Geração operacional usada para produzir ou ler a resposta.
      schema:
        type: string
        format: uuid
    CacheControlNoStore:
      description: Resposta sensível não deve ser armazenada.
      schema:
        type: string
        const: no-store
    PragmaNoCache:
      description: Compatibilidade HTTP/1.0 para resposta sensível não armazenável.
      schema:
        type: string
        const: no-cache
    ReferrerPolicyNoReferrer:
      description: Impede envio de referrer a partir da superfície externa.
      schema:
        type: string
        const: no-referrer
    XContentTypeOptionsNoSniff:
      description: Desabilita MIME sniffing.
      schema:
        type: string
        const: nosniff
    ContentSecurityPolicyExternal:
      description: CSP mínima para páginas e respostas da superfície externa.
      schema:
        type: string
        const: default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        reason:
          type: string
      additionalProperties: false
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        correlation_id:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - code
      - message
      - details
      - correlation_id
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      required:
      - error
    ResponseMeta:
      type: object
      properties:
        correlation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        demo_generation_id:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - correlation_id
      - occurred_at
      - demo_generation_id
    PageInfo:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      additionalProperties: false
      required:
      - next_cursor
      - has_more
    HealthLiveResponse:
      type: object
      properties:
        status:
          type: string
          const: UP
      additionalProperties: false
      required:
      - status
    HealthReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
              - UP
              - DOWN
            migrations:
              type: string
              enum:
              - UP
              - DOWN
            worker:
              type: string
              enum:
              - UP
              - DOWN
            seed:
              type: string
              enum:
              - UP
              - DOWN
          additionalProperties: false
          required:
          - database
          - migrations
          - worker
          - seed
      additionalProperties: false
      required:
      - status
      - checks
    CreateDemoSessionRequest:
      type: object
      properties:
        identity_code:
          type: string
          enum:
          - demo.attendant
          - demo.operations
          - demo.supervisor
          - demo.manager
          - demo.admin
      additionalProperties: false
      required:
      - identity_code
    PermissionGrant:
      type: object
      properties:
        permission_code:
          type: string
      additionalProperties: false
      required:
      - permission_code
    ScopeGrant:
      type: object
      properties:
        scope_type:
          type: string
          enum:
          - OPERATING_UNIT
          - CUSTOMER
          - TEAM
        scope_id:
          type: string
          format: uuid
        display_name:
          type: string
      additionalProperties: false
      required:
      - scope_type
      - scope_id
      - display_name
    CurrentIdentity:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        identity_code:
          type: string
        display_name:
          type: string
        role_code:
          type: string
