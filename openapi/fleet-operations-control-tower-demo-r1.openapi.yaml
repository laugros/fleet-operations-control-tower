          - ROLE_DEMO_ATTENDANT
          - ROLE_DEMO_OPERATIONS_ANALYST
          - ROLE_DEMO_SUPERVISOR
          - ROLE_DEMO_MANAGER
          - ROLE_DEMO_ADMIN
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeGrant'
      additionalProperties: false
      required:
      - user_id
      - identity_code
      - display_name
      - role_code
      - permissions
      - scopes
    DemoSessionData:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        identity:
          $ref: '#/components/schemas/CurrentIdentity'
        idle_expires_at:
          type: string
