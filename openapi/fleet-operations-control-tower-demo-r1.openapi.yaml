          description: 'Erro: ACTION_NOT_PERMITTED, CSRF_VALIDATION_FAILED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: RESOURCE_NOT_FOUND.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        401:
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
        403:
        - ACTION_NOT_PERMITTED
        - CSRF_VALIDATION_FAILED
        404:
        - RESOURCE_NOT_FOUND
      x-demo-generation-guard: CONTROL_READ
  /api/v1/search:
    get:
      operationId: searchOperationalResources
      summary: Buscar placa, caso ou parada
      tags:
      - Search
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CASE
            - STOP
            - VEHICLE
          uniqueItems: true
        style: form
        explode: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      security:
      - internalSession: []
      x-permission: search.read
      x-scope-policy: USER_SCOPE_FILTER
      x-field-policy: FIELD-INTERNAL-OPERATIONAL
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          description: 'Erro: AUTHENTICATION_REQUIRED, SESSION_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: ACTION_NOT_PERMITTED, CSRF_VALIDATION_FAILED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: RESOURCE_NOT_FOUND.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 'Erro: SEARCH_QUERY_TOO_SHORT, UNSUPPORTED_SEARCH_TYPE.'
          headers:
