openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Fleet Operations Control Tower — DEMO-R1 API
  version: 2.1.4
  description: Contrato HTTP normativo da DEMO-R1 v2.1.4. A revisão R7 autorizou somente o scaffold e a implementação do G1_FOUNDATION.
servers:
- url: http://localhost:3000
  description: Ambiente local da demonstração
tags:
- name: Health
- name: Session
- name: Demo
- name: Search
- name: Dashboard
- name: Cases
- name: Tasks
- name: Stops
- name: Communications
- name: Integrations
- name: External Access
- name: External
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Consultar liveness
      tags:
      - Health
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      security: []
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
      x-demo-generation-guard: NOT_APPLICABLE
  /health/ready:
    get:
      operationId: getReadiness
      summary: Consultar readiness
      tags:
      - Health
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      security: []
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: 'Erro: SERVICE_NOT_READY.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        503:
        - SERVICE_NOT_READY
      x-demo-generation-guard: NOT_APPLICABLE
  /api/v1/demo/sessions:
    post:
      operationId: createDemoSession
      summary: Selecionar identidade e criar sessão da demo
      tags:
      - Session
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoSessionRequest'
      security: []
      x-field-policy: FIELD-DEMO-STATUS
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      description: Não aceita role, permission, user_id ou scopes enviados pelo cliente.
      responses:
        '201':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-CSRF-Token:
              $ref: '#/components/headers/XCsrfToken'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionResponse'
        '400':
          description: 'Erro: INVALID_REQUEST.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: DEMO_FEATURE_DISABLED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: DEMO_IDENTITY_NOT_ALLOWED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Erro: RATE_LIMIT_EXCEEDED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Erro: DEMO_RESET_IN_PROGRESS.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        400:
        - INVALID_REQUEST
        403:
        - DEMO_FEATURE_DISABLED
        404:
        - DEMO_IDENTITY_NOT_ALLOWED
        429:
        - RATE_LIMIT_EXCEEDED
      x-demo-generation-guard: ACTIVE_REQUIRED
  /api/v1/demo/sessions/current:
    delete:
      operationId: deleteDemoSession
      summary: Encerrar a sessão interna atual
      tags:
      - Session
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      security:
      - internalSession: []
        internalCsrf: []
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '204':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
        '401':
          description: 'Erro: AUTHENTICATION_REQUIRED, SESSION_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: CSRF_VALIDATION_FAILED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Erro: DEMO_RESET_IN_PROGRESS.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        401:
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
        403:
        - CSRF_VALIDATION_FAILED
      x-demo-generation-guard: ACTIVE_REQUIRED
  /api/v1/session:
    get:
      operationId: getCurrentSession
      summary: Consultar identidade, permissões e escopos atuais
      tags:
      - Session
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      security:
      - internalSession: []
      x-permission: session.read
      x-scope-policy: SELF_SESSION
      x-field-policy: FIELD-INTERNAL-OPERATIONAL
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '401':
          description: 'Erro: AUTHENTICATION_REQUIRED, SESSION_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        401:
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
      x-demo-generation-guard: READ_ACTIVE_OR_LAST_CONFIRMED
  /api/v1/demo/status:
    get:
      operationId: getDemoStatus
      summary: Consultar o estado técnico da demonstração
      tags:
      - Demo
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      security:
      - internalSession: []
      x-permission: demo.read_status
      x-scope-policy: SCOPE-DEMO-ADMIN
      x-field-policy: FIELD-DEMO-STATUS
      x-idempotency: NOT_REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatusResponse'
        '401':
          description: 'Erro: AUTHENTICATION_REQUIRED, SESSION_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: ACTION_NOT_PERMITTED, CSRF_VALIDATION_FAILED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: RESOURCE_NOT_FOUND.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        401:
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
        403:
        - ACTION_NOT_PERMITTED
        - CSRF_VALIDATION_FAILED
        404:
        - RESOURCE_NOT_FOUND
      x-demo-generation-guard: CONTROL_READ
  /api/v1/demo/clock/advance:
    post:
      operationId: advanceDemoClock
      summary: Avançar o relógio controlado
      tags:
      - Demo
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceDemoClockRequest'
      security:
      - internalSession: []
        internalCsrf: []
      x-permission: demo.advance_clock
      x-scope-policy: SCOPE-DEMO-ADMIN
      x-command: AdvanceDemoClock
      x-primary-event: DemoClockAdvanced
      x-idempotency: REQUIRED
      x-concurrency: IF_MATCH_REQUIRED
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceDemoClockResponse'
        '401':
          description: 'Erro: AUTHENTICATION_REQUIRED, SESSION_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: ACTION_NOT_PERMITTED, CSRF_VALIDATION_FAILED, DEMO_FEATURE_DISABLED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: RESOURCE_NOT_FOUND.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Erro: IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: 'Erro: STALE_RESOURCE_VERSION.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: 'Erro: EXPECTED_RESOURCE_VERSION_REQUIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 'Erro: INVALID_REQUEST, DEMO_CLOCK_ADVANCE_LIMIT_EXCEEDED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Erro: DEMO_RESET_IN_PROGRESS.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        401:
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
        403:
        - ACTION_NOT_PERMITTED
        - CSRF_VALIDATION_FAILED
        - DEMO_FEATURE_DISABLED
        404:
        - RESOURCE_NOT_FOUND
        409:
        - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD
        412:
        - STALE_RESOURCE_VERSION
        428:
        - EXPECTED_RESOURCE_VERSION_REQUIRED
        400:
        - INVALID_REQUEST
        - DEMO_CLOCK_ADVANCE_LIMIT_EXCEEDED
      x-primary-event-schema-version: 2
      x-demo-generation-guard: ACTIVE_REQUIRED
  /api/v1/demo/reset:
    post:
      operationId: resetDemoScenario
      summary: Solicitar reset determinístico da demo
      tags:
      - Demo
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetDemoRequest'
      security:
      - internalSession: []
        internalCsrf: []
      x-permission: demo.reset
      x-scope-policy: SCOPE-DEMO-ADMIN
      x-command: ResetDemoScenario
      x-primary-event: DemoResetRequested
      x-idempotency: REQUIRED
      x-concurrency: NOT_REQUIRED
      responses:
        '202':
          description: Sucesso.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetExecutionResponse'
        '400':
          description: 'Erro: INVALID_REQUEST, DEMO_RESET_CONFIRMATION_INVALID.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Erro: AUTHENTICATION_REQUIRED, SESSION_EXPIRED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Erro: ACTION_NOT_PERMITTED, CSRF_VALIDATION_FAILED, DEMO_FEATURE_DISABLED.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Erro: DEMO_SEED_VERSION_NOT_FOUND.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Erro: DEMO_RESET_ALREADY_IN_PROGRESS, IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Erro: DEMO_RESET_IN_PROGRESS.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Demo-Generation-ID:
              $ref: '#/components/headers/XDemoGenerationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-error-codes:
        400:
        - INVALID_REQUEST
        - DEMO_RESET_CONFIRMATION_INVALID
        401:
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
        403:
        - ACTION_NOT_PERMITTED
        - CSRF_VALIDATION_FAILED
        - DEMO_FEATURE_DISABLED
        404:
        - DEMO_SEED_VERSION_NOT_FOUND
        409:
        - DEMO_RESET_ALREADY_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_PAYLOAD
      x-primary-event-schema-version: 2
      x-demo-generation-guard: CONTROL_OPERATION
  /api/v1/demo/resets/{resetId}:
