        expires_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - session_id
      - identity
      - idle_expires_at
      - expires_at
    DemoSessionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DemoSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false
      required:
      - data
      - meta
    CurrentSessionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CurrentIdentity'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false
      required:
      - data
      - meta
    DemoServiceStatus:
      type: object
      properties:
        database:
          type: string
          enum:
          - HEALTHY
          - UNHEALTHY
        worker:
          type: string
          enum:
          - HEALTHY
          - UNHEALTHY
        mailpit:
          type: string
          enum:
          - HEALTHY
          - UNHEALTHY
      additionalProperties: false
      required:
      - database
      - worker
      - mailpit
    DemoStatusData:
      type: object
      properties:
        demo_mode:
          type: boolean
