    IssueExternalAccessData:
      type: object
      properties:
        token_id:
          type: string
          format: uuid
        audience:
          type: string
          enum:
          - SUPPLIER
          - DRIVER
        access_url:
          type: string
          description: URL one-time retornada somente nesta resposta, com token no fragmento. Nunca deve ser registrada em log, tracing ou auditoria.
          pattern: ^/external/action#token=
          readOnly: true
          x-sensitive-one-time-response: true
        allowed_actions:
          type: array
          items:
            type: string
          uniqueItems: true
        expires_at:
          type: string
          format: date-time
        token_version:
          type: integer
          const: 1
          description: Versão do aggregate EXTERNAL_ACCESS_TOKEN. Não é ETag da parada.
      additionalProperties: false
      required:
      - token_id
      - audience
      - access_url
      - allowed_actions
      - expires_at
      - token_version
    IssueExternalAccessResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/IssueExternalAccessData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false
      required:
      - data
      - meta
    CreateExternalSessionRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
      additionalProperties: false
      required:
      - token
    ExternalSessionData:
