  - token-lifecycle-handler
  causing_commands:
  - AutoRevokeExternalAccess
  source_operations: []
  data_classification: CONFIDENTIAL
  ordering_key: demo_generation_id + aggregate_type + aggregate_id + aggregate_sequence
  live_production_deduplication: token_id + revocation_reason_code + causing_event_id or lifecycle_occurrence_id
  delivery: AT_LEAST_ONCE
  replay_policy: PROJECTION_ONLY
  description: 'Token revogado exclusivamente por política automática: substituição, expiração, mudança de sujeito, retirada, fechamento, limite
    de uso, reset ou falha de segurança. Segredo e hash nunca são publicados.'
  consumers:
  - mode: LIVE_AND_REPLAY
    dedup: demo_generation_id + domain_event_id
    consumer_code: timeline-projector
    effect: Adicionar revogação sanitizada.
  generation_rule: event.demo_generation_id MUST equal the active generation at production
  aggregate_version_rule: aggregate_sequence = resulting aggregate_version
