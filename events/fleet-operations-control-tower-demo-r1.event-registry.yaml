registry_version: 2.1.3
release: DEMO-R1
schema_bundle: fleet-operations-control-tower-demo-r1.events.schema.json
delivery_semantics:
  guarantee: AT_LEAST_ONCE
  global_order: false
  aggregate_order: true
  ordering_key: demo_generation_id + aggregate_type + aggregate_id + aggregate_sequence
  aggregate_version_rule: aggregate_sequence = resulting aggregate_version
  consumer_idempotency_key: demo_generation_id + consumer_code + domain_event_id
  generation_commit_guard:
    required_runtime_status: ACTIVE
    required_relation: event.demo_generation_id = demo_runtime_control.active_generation_id
    failure_code: STALE_DEMO_GENERATION
  retry_schedule:
  - PT1M
  - PT5M
  - PT15M
  - PT30M
  - PT60M
  after_retry_exhaustion: DEAD_LETTER
replay_modes:
  LIVE: Todos os consumidores habilitados; commit exige geração ativa.
  PROJECTION_REBUILD: Somente LIVE_AND_REPLAY; handlers LIVE_ONLY ficam desabilitados; rebuild grava a geração ativa.
  CONTROL_EVENT: Eventos de controle não participam de rebuild nem são reexecutados.
consumers:
- consumer_code: alert-resolver
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: arrival-conflict-alert-handler
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
  description: Executa CreateArrivalConflictAlert após ArrivalConflictDetected; efeito LIVE_ONLY e idempotente por geração, consumer e evento.
- consumer_code: arrival-conflict-task-handler
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
  description: Executa CreateArrivalConflictTask após ArrivalConflictDetected e CompleteArrivalConflictTask após ArrivalConfirmed; efeitos LIVE_ONLY.
- consumer_code: arrival-evaluator
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: case-resume-handler
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: case-view-projector
  mode: LIVE_AND_REPLAY
  dedup: demo_generation_id + domain_event_id
- consumer_code: conversation-link-suggester
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: demo-reset-coordinator
  mode: LIVE_ONLY_CONTROL
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: metrics-projector
  mode: LIVE_AND_REPLAY
  dedup: demo_generation_id + domain_event_id
- consumer_code: search-projector
  mode: LIVE_AND_REPLAY
  dedup: demo_generation_id + domain_event_id
- consumer_code: stop-inactivity-evaluator
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: stop-view-projector
  mode: LIVE_AND_REPLAY
  dedup: demo_generation_id + domain_event_id
- consumer_code: task-resume-handler
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
- consumer_code: timeline-projector
  mode: LIVE_AND_REPLAY
  dedup: demo_generation_id + domain_event_id
- consumer_code: token-lifecycle-handler
  mode: LIVE_ONLY
  dedup: demo_generation_id + consumer_code + event_id
  description: Executa AutoRevokeExternalAccess para condições automáticas de ciclo de vida.
events:
- event_type: DemoClockAdvanced
  schema_version: 2
  schema_ref: ./fleet-operations-control-tower-demo-r1.events.schema.json#/$defs/DemoClockAdvancedEvent
  payload_schema: DemoClockAdvancedPayload
  aggregate_type: DEMO_CLOCK
  producers:
  - demo-service
  causing_commands:
  - AdvanceDemoClock
  source_operations:
  - operation_id: advanceDemoClock
    command: AdvanceDemoClock
    method: POST
    path: /api/v1/demo/clock/advance
  data_classification: INTERNAL
  ordering_key: demo_generation_id + aggregate_type + aggregate_id + aggregate_sequence
  live_production_deduplication: idempotency_record_id or causing consumer receipt
  delivery: AT_LEAST_ONCE
  replay_policy: CONTROL_EVENT_NO_REPLAY_EFFECTS
  description: Registra avanço monotônico do relógio. Timestamps históricos não são alterados.
  consumers:
  - mode: LIVE_ONLY
    dedup: demo_generation_id + consumer_code + event_id
    consumer_code: stop-inactivity-evaluator
    effect: Avaliar STOP_NO_UPDATE usando o novo DemoClock.
  generation_rule: event.demo_generation_id MUST equal the active generation at production
  aggregate_version_rule: aggregate_sequence = resulting aggregate_version
- event_type: DemoResetRequested
  schema_version: 2
  schema_ref: ./fleet-operations-control-tower-demo-r1.events.schema.json#/$defs/DemoResetRequestedEvent
  payload_schema: DemoResetRequestedPayload
  aggregate_type: DEMO_RESET
  producers:
  - demo-service
  causing_commands:
  - ResetDemoScenario
  source_operations:
  - operation_id: resetDemoScenario
    command: ResetDemoScenario
    method: POST
    path: /api/v1/demo/reset
  data_classification: CONFIDENTIAL
  ordering_key: demo_generation_id + aggregate_type + aggregate_id + aggregate_sequence
  live_production_deduplication: idempotency_record_id or causing consumer receipt
  delivery: AT_LEAST_ONCE
  replay_policy: NON_REPLAYABLE_CONTROL
  description: Evento de controle emitido na geração de origem; identifica a geração alvo em PREPARING e é não reexecutável.
  consumers:
  - mode: LIVE_ONLY_CONTROL
    dedup: demo_generation_id + consumer_code + event_id
    consumer_code: demo-reset-coordinator
    effect: Executar reset sob advisory lock e boundary transacional.
  generation_rule: event.demo_generation_id MUST equal the active generation at production
  aggregate_version_rule: aggregate_sequence = resulting aggregate_version
- event_type: CaseWorkStarted
