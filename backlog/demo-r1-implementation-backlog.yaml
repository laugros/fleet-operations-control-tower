id_policy:
  work_package_rule: work_package_id = 'WP-' + requirement_id
  renumbering: FORBIDDEN
  secondary_work_package_sequences: FORBIDDEN
  slice_rule: slice_id = work_package_id + '/S' + ordinal
planning_policy:
  all_packages_release_blocking: true
  maximum_slice_effort_points: 5
  package_role: Work package is a traceability container; implementation occurs through slices.
  parallelization: A package may run in parallel only after every dependency is complete and the previous gate is approved.
  operation_ownership: Exactly one primary owner per operation ID.
  event_ownership: WP-DEMO-EVT-001 owns event schema infrastructure; each event has one semantic owner.
  status_policy: R7 authorizes only G1_FOUNDATION. G1 work packages and slices are READY_FOR_IMPLEMENTATION. All later gates remain BLOCKED_BY_PREVIOUS_GATE.
  reverse_traceability: Acceptance and E2E IDs are copied exactly from the v2.1.3 traceability row for the same work_package_id.
  test_activation_policy: Tests are activated exactly once according to the canonical gate test plan. Later gates execute cumulative regression.
